name: Update FI

on:

  workflow_dispatch:

  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: |
        pip install -r scripts/requirements.txt

    - run: |
        python scripts/crawl_fi.py

    - run: |
        python scripts/build_tree.py

    - name: commit

      run: |

        git config user.name github-actions
        git config user.email actions@github.com

        git add .

        git diff --cached --quiet || git commit -m "update fi"

        git push
